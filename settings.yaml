# GraphRAG 配置文件 - 使用 DeepSeek API
# 详细配置说明请参考 README_GRAPHRAG.md

encoding_model: cl100k_base
skip_workflows: []
llm:
  api_key: ${GRAPHRAG_API_KEY}
  type: openai_chat  # DeepSeek 兼容 OpenAI 接口
  model: deepseek-chat  # DeepSeek 模型
  model_supports_json: true
  max_tokens: 4096
  request_timeout: 180.0
  api_base: https://api.deepseek.com/v1  # DeepSeek API 地址
  api_version: 2024-01-01
  concurrent_requests: 25
  tokens_per_minute: 50000
  requests_per_minute: 10
  max_retries: 10
  max_retry_wait: 10.0
  sleep_on_rate_limit_recommendation: true

parallelization:
  stagger: 0.3
  num_threads: 50

async_mode: threaded

embeddings:
  # 使用 OpenAI 的嵌入模型
  async_mode: threaded
  llm:
    api_key: ${GRAPHRAG_EMBEDDING_API_KEY}
    type: openai_embedding
    model: text-embedding-3-small  # OpenAI 嵌入模型
    api_base: https://api.openai.com/v1
    api_version: 2024-01-01
    batch_size: 16
    concurrent_requests: 25
    tokens_per_minute: 150000
    requests_per_minute: 500
    max_retries: 10
    max_retry_wait: 10.0
    sleep_on_rate_limit_recommendation: true
  batch_size: 16
  batch_max_tokens: 8191
  target: required

chunks:
  size: 1200
  overlap: 100
  group_by_columns: [id]
  encoding_model: cl100k_base

input:
  type: file
  file_type: text
  base_dir: "input"
  file_encoding: utf-8
  file_pattern: ".*\\.txt$"

cache:
  type: file
  base_dir: "cache"

storage:
  type: file
  base_dir: "output/${timestamp}/artifacts"

reporting:
  type: file
  base_dir: "output/${timestamp}/reports"

entity_extraction:
  prompt: "prompts/entity_extraction.txt"
  entity_types: [organization, person, location, event, concept]
  max_gleanings: 0

summarize_descriptions:
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

claim_extraction:
  enabled: false
  prompt: "prompts/claim_extraction.txt"
  description: "对每个文本块进行声明提取"
  max_gleanings: 0

community_reports:
  prompt: "prompts/community_report.txt"
  max_length: 2000
  max_input_length: 8000

cluster_graph:
  max_cluster_size: 10

embed_graph:
  enabled: false
  num_walks: 10
  walk_length: 10
  window_size: 2
  iterations: 3
  random_seed: 597832

umap:
  enabled: false

snapshots:
  graphml: false
  raw_entities: false
  top_level_nodes: false

local_search:
  text_unit_prop: 0.5
  community_prop: 0.1
  conversation_history_max_turns: 5
  top_k_entities: 10
  top_k_relationships: 10
  temperature: 0.0
  top_p: 1.0
  max_tokens: 12000

global_search:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 12000
  data_max_tokens: 12000
  map_max_tokens: 1000
  reduce_max_tokens: 2000
  concurrency: 32