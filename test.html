<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphRAG测试页面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-50 via-pink-50 to-blue-50 min-h-screen">
    <div class="container mx-auto px-4 py-16">
        <h1 class="text-4xl font-bold text-center mb-8 gradient-text">GraphRAG功能测试</h1>
        
        <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-8">
            <h2 class="text-2xl font-bold mb-4">🤖 智能查询测试</h2>
            
            <div class="mb-6">
                <label for="question" class="block text-sm font-medium text-gray-700 mb-2">请输入您的问题：</label>
                <textarea id="question" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="例如：费正清的主要研究成果是什么？"></textarea>
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">查询方法：</label>
                <div class="flex space-x-4">
                    <label class="flex items-center">
                        <input type="radio" name="method" value="global" checked class="mr-2">
                        <span>全局查询</span>
                    </label>
                    <label class="flex items-center">
                        <input type="radio" name="method" value="local" class="mr-2">
                        <span>局部查询</span>
                    </label>
                </div>
            </div>
            
            <button id="query-btn" class="bg-gradient-to-r from-purple-600 to-blue-600 text-white px-6 py-3 rounded-lg hover:from-purple-700 hover:to-blue-700 transition-all duration-300">
                🔍 开始查询
            </button>
            
            <div id="result" class="mt-6 p-4 bg-gray-50 rounded-lg hidden">
                <h3 class="font-bold mb-2">查询结果：</h3>
                <div id="result-content"></div>
            </div>
        </div>
        
        <div class="text-center mt-8">
            <a href="index.html" class="text-purple-600 hover:text-purple-800 underline">← 返回主页</a>
        </div>
    </div>

    <script>
        const demoResponses = {
            '费正清的主要研究成果是什么？': '费正清（John K. Fairbank）是美国汉学泰斗，哈佛大学教授。他的主要研究成果包括：\n\n1. **中国近代史研究**：开创了美国中国近代史研究的新范式\n2. **中美关系史**：深入研究中美两国的历史交往\n3. **学术著作**：《美国与中国》、《剑桥中国史》等经典著作\n4. **学术影响**：培养了众多汉学研究者，建立了哈佛大学东亚研究中心',
            '汉学家之间有什么联系？': '汉学家之间形成了复杂的学术关系网络：\n\n**学术传承关系**：\n- 费正清培养了众多学生，如史景迁、孔飞力等\n- 理雅各的翻译工作影响了后来的汉学研究\n\n**研究领域合作**：\n- 李约瑟与多位中国学者合作研究科技史\n- 伯希和与沙畹等法国汉学家共同研究敦煌学',
            '哪些汉学家研究中国古代文学？': '研究中国古代文学的著名汉学家包括：\n\n**古典文学翻译**：\n- 理雅各（James Legge）：翻译《四书五经》\n- 韦利（Arthur Waley）：翻译《诗经》、《论语》等\n- 霍克斯（David Hawkes）：翻译《红楼梦》\n\n**文学研究**：\n- 宇文所安（Stephen Owen）：唐诗研究\n- 高本汉（Bernhard Karlgren）：古代音韵学'
        };

        document.getElementById('query-btn').addEventListener('click', function() {
            const question = document.getElementById('question').value.trim();
            const method = document.querySelector('input[name="method"]:checked').value;
            
            if (!question) {
                alert('请输入查询问题');
                return;
            }
            
            const resultDiv = document.getElementById('result');
            const resultContent = document.getElementById('result-content');
            
            // 模拟查询延迟
            setTimeout(() => {
                const response = demoResponses[question] || '这是一个很好的问题！要获得完整的GraphRAG智能回答，请在本地部署服务器。';
                resultContent.innerHTML = response.replace(/\n/g, '<br>');
                resultDiv.classList.remove('hidden');
            }, 1000);
        });
    </script>
</body>
</html>
